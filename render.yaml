# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: findur-api-kdb
    runtime: go
    plan: free
    region: virginia
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: cd backend && mkdir -p bin && go build -o bin/findur ./cmd/findur && go build -o bin/migrate ./cmd/migrate
    startCommand: ./scripts/render-start.sh
    healthCheckPath: /api/healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: findur-db
          property: connectionString

  - type: web
    name: findur-web-kdb
    runtime: static
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm --prefix frontend ci && npm --prefix frontend run build
    staticPublishPath: frontend/dist
    envVars:
      - key: NODE_VERSION
        value: 26.9.0
    routes:
      - type: rewrite
        source: /api/*
        destination: https://findur-api-kdb.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: findur-db
    plan: free
    region: virginia
    postgresMajorVersion: "18"
    databaseName: findur
    user: findur
    ipAllowList: []
