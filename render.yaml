# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: findur-api-kdb
    runtime: image
    plan: free
    region: virginia
    autoDeployTrigger: off
    image:
      # One-time provisioning reference only; normal releases deploy full-SHA images by digest.
      url: docker.io/kdbuck/findur:bootstrap-once
    healthCheckPath: /api/healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: findur-db
          property: connectionString
      - key: AUTH_INITIATION_ENABLED
        sync: false
      - key: SNAPTRADE_OAUTH_CLIENT_ID
        sync: false
      - key: SNAPTRADE_OAUTH_CLIENT_SECRET
        sync: false
      - key: SNAPTRADE_CONSUMER_KEY
        sync: false
      - key: SNAPTRADE_WEBHOOK_PROCESSING_ENABLED
        value: "false"
      - key: SNAPTRADE_OAUTH_CALLBACK_URL
        sync: false
      - key: SNAPTRADE_OIDC_ISSUER
        sync: false
      - key: OAUTH_HASH_KEY
        sync: false
      - key: OAUTH_ENCRYPTION_KEY
        sync: false
      - key: SESSION_HASH_KEY
        sync: false
      - key: PUBLIC_ORIGIN
        value: https://findur-web-kdb.onrender.com
      - key: OAUTH_TOKEN_KEY_V1
        sync: false

  - type: web
    name: findur-web-kdb
    runtime: static
    branch: main
    autoDeployTrigger: off
    buildCommand: VITE_BUILD_SHA="$RENDER_GIT_COMMIT" npm --prefix frontend ci && VITE_BUILD_SHA="$RENDER_GIT_COMMIT" npm --prefix frontend run build
    staticPublishPath: frontend/dist
    envVars:
      - key: NODE_VERSION
        value: 26.9.0
      - key: VITE_REQUIRE_BUILD_SHA
        value: "true"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://findur-api-kdb.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: findur-db
    plan: free
    region: virginia
    postgresMajorVersion: "18"
    databaseName: findur
    user: findur
    ipAllowList: []
