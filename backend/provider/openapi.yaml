      "HoldingsStatus": {
        "description": "Status of account holdings sync. SnapTrade syncs holdings from the brokerage under the following conditions:\n1. Initial connection - SnapTrade syncs all holdings (positions, balances, recent orders, and transactions) immediately after the connection is established.\n2. Daily sync - Once a day SnapTrade refreshes all holdings from the brokerage.\n3. Manual sync - You can trigger a refresh of holdings with the [manual refresh](/reference/Connections/Connections_refreshBrokerageAuthorization) endpoint.\n",
        "properties": {
          "holdings_unavailable": {
            "description": "Indicates that the brokerage does not expose this account's holdings to SnapTrade, so the\nempty positions and balances reported for it do not mean the account is empty. This is set\nfor accounts served by a separate brokerage system that we cannot read, such as Vanguard\nemployer-sponsored retirement plans. When this is `true`, prefer the account's total value\nover the sum of its positions and cash, and note that `initial_sync_completed` and\n`last_successful_sync` may still reflect an earlier sync.\n",
            "example": true,
            "type": "boolean"
          },
          "initial_sync_completed": {
            "description": "Indicates if the initial sync of holdings has been completed. For accounts with a large number of positions/orders/transactions, the initial sync may take a while to complete.",
            "example": true,
            "type": "boolean"
          },
          "last_successful_sync": {
            "allOf": [
              {
                "$ref": "#/components/schemas/HoldingsSyncStatusDate"
              }
            ],
            "description": "The last time holdings were successfully synced by SnapTrade.",
            "nullable": true
          }
        }
      },
      "HoldingsSyncStatusDate": {
        "description": "Date in ISO 8601 format or null (YYYY-MM-DD HH:MM:SS.mmmmmmTZ)",
        "example": "2024-06-28 18:42:46.561408+00:00",
        "format": "date-time",
        "nullable": true,
        "type": "string"
      },
      "Id": {
        "example": "2bcd7cc3-e922-4976-bce1-9858296801c3",
        "format": "uuid",
        "type": "string"
      },
      "PortfolioGroupID": {
        "deprecated": true,
        "description": "Portfolio Group ID. Portfolio Groups have been deprecated. Please contact support if you have a use case for it.",
        "example": "2bcd7cc3-e922-4976-bce1-9858296801c3",
        "format": "uuid",
        "nullable": true,
        "type": "string"
      },
      "SyncStatusDate": {
        "description": "Date in YYYY-MM-DD format or null",
        "example": "2022-01-24",
        "format": "date",
        "nullable": true,
        "type": "string"
      },
      "TransactionsStatus": {
        "description": "Status of account transaction sync. SnapTrade syncs transactions from the brokerage under the following conditions:\n1. Initial connection - SnapTrade syncs all transactions from the brokerage account as far back as the brokerage allows. Check [our integrations doc](https://support.snaptrade.com/brokerages-table?v=6fab8012ade6441fa0c6d9af9c55ce3a) for details on how far back we sync for each brokerage.\n2. Daily sync - Once a day SnapTrade syncs new transactions from the brokerage.\n3. Manual sync - You can trigger an incremental sync of transactions with the [transactions sync](/reference/Experimental%20endpoints/Connections_syncBrokerageAuthorizationTransactions) endpoint.\n",
        "properties": {
          "first_transaction_date": {
            "allOf": [
              {
                "$ref": "#/components/schemas/SyncStatusDate"
              }
            ],
            "description": "The date of the first transaction in the account known to SnapTrade. It's possible that the account has transactions before this date, but they are not known to SnapTrade.",
            "nullable": true
          },
          "initial_sync_completed": {
            "description": "Indicates if the initial sync of transactions has been completed. For accounts with a large number of transactions, the initial sync may take a while to complete.",
            "example": true,
            "type": "boolean"
          },
          "last_successful_sync": {
            "allOf": [
              {
                "$ref": "#/components/schemas/SyncStatusDate"
              }
            ],
            "description": "All transactions up to this date have been successfully synced. Please note that this is not the date of the last transaction, nor the last time SnapTrade attempted to sync transactions.",
            "nullable": true
          }
        }
      }
    },
    "securitySchemes": {
      "OAuthBearer": {
        "scheme": "bearer",
        "type": "http"
      }
    }
