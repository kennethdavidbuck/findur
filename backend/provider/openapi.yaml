  "paths": {
    "/authorizations": {
      "get": {
        "description": "Returns a list of all connections for the specified user. Note that `Connection` and `Brokerage Authorization` are interchangeable, but the term `Connection` is preferred and used in the doc for consistency.\n\nA connection is usually tied to a single login at a brokerage. A single connection can contain multiple brokerage accounts.\n\nSnapTrade performs de-duping on connections for a given user. If the user has an existing connection with the brokerage, when connecting the brokerage with the same credentials, SnapTrade will return the existing connection instead of creating a new one.\n",
        "operationId": "Connections_listBrokerageAuthorizations",
        "parameters": [],
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "description": "A list of all connections for the specified user.",
                  "items": {
                    "$ref": "#/components/schemas/BrokerageAuthorization"
                  },
                  "type": "array"
                }
              }
            },
            "description": "OK"
          },
          "default": {
            "description": "Unexpected error."
          }
        },
        "security": [
          {
            "OAuthBearer": []
          }
        ],
        "summary": "List all connections",
        "tags": [
          "Connections"
        ]
      }
