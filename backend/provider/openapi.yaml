      "HoldingsStatus": {
        "description": "Status of account holdings sync. SnapTrade syncs holdings from the brokerage under the following conditions:\n1. Initial connection - SnapTrade syncs all holdings (positions, balances, recent orders, and transactions) immediately after the connection is established.\n2. Daily sync - Once a day SnapTrade refreshes all holdings from the brokerage.\n3. Manual sync - You can trigger a refresh of holdings with the [manual refresh](/reference/Connections/Connections_refreshBrokerageAuthorization) endpoint.\n",
        "properties": {
          "holdings_unavailable": {
            "description": "Indicates that the brokerage does not expose this account's holdings to SnapTrade, so the\nempty positions and balances reported for it do not mean the account is empty. This is set\nfor accounts served by a separate brokerage system that we cannot read, such as Vanguard\nemployer-sponsored retirement plans. When this is `true`, prefer the account's total value\nover the sum of its positions and cash, and note that `initial_sync_completed` and\n`last_successful_sync` may still reflect an earlier sync.\n",
            "example": true,
            "type": "boolean"
          },
          "initial_sync_completed": {
            "description": "Indicates if the initial sync of holdings has been completed. For accounts with a large number of positions/orders/transactions, the initial sync may take a while to complete.",
            "example": true,
            "type": "boolean"
          },
          "last_successful_sync": {
            "allOf": [
              {
                "$ref": "#/components/schemas/HoldingsSyncStatusDate"
              }
