{
  "components": {
    "headers": {
      "X-RateLimit-Account-Limit": {
        "description": "Per-account request allowance for the current window. Only sent on account-data endpoints where the account-level limit applies.",
        "schema": {
          "example": 10,
          "type": "integer"
        }
      },
      "X-RateLimit-Account-Remaining": {
        "description": "Per-account requests left in the current window. 0 on a 429 means this is the limit you hit.",
        "schema": {
          "example": 9,
          "type": "integer"
        }
      },
      "X-RateLimit-Account-Reset": {
        "description": "Seconds until the per-account window resets.",
        "schema": {
          "example": 60,
          "type": "integer"
        }
      },
      "X-RateLimit-Limit": {
        "description": "Customer-level request allowance for the current window.",
        "schema": {
          "example": 250,
          "type": "integer"
        }
      },
      "X-RateLimit-Remaining": {
        "description": "Customer-level requests left in the current window. 0 on a 429 means this is the limit you hit.",
        "schema": {
          "example": 249,
          "type": "integer"
        }
      },
      "X-RateLimit-Reset": {
        "description": "Seconds until the customer-level window resets.",
        "schema": {
          "example": 60,
          "type": "integer"
        }
      }
    },
    "responses": {
      "TooManyRequests": {
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/429TooManyRequestsResponse"
            }
          }
        },
        "description": "Rate limit exceeded. Check `X-RateLimit-Remaining` (customer-level) and\n`X-RateLimit-Account-Remaining` (account-level) to see which limit you\nhit, then wait for the matching `*-Reset` value before retrying.\n\nNot every header listed below appears on every operation. The\n`X-RateLimit-Account-*` headers are sent only where the per-account limit\nis enforced, and OAuth-authenticated requests never receive the\ncustomer-level `X-RateLimit-Limit`, `X-RateLimit-Remaining` or\n`X-RateLimit-Reset`.\n\nA separate per-authenticated-user limit, reported in no `X-RateLimit-*`\nheader, covers OAuth-authenticated requests and signed requests not\ngoverned by the customer-level limit; it does not stack on top of that\nlimit. So a 429 can arrive with every reported counter above zero — or\nwith no `X-RateLimit-*` headers at all. Honour `Retry-After` in that\ncase.\n",
        "headers": {
          "Retry-After": {
            "description": "Seconds to wait before retrying.",
            "schema": {
              "example": 7,
              "type": "integer"
            }
          },
          "X-RateLimit-Account-Limit": {
            "$ref": "#/components/headers/X-RateLimit-Account-Limit"
          },
          "X-RateLimit-Account-Remaining": {
            "$ref": "#/components/headers/X-RateLimit-Account-Remaining"
          },
          "X-RateLimit-Account-Reset": {
            "$ref": "#/components/headers/X-RateLimit-Account-Reset"
          },
          "X-RateLimit-Limit": {
            "$ref": "#/components/headers/X-RateLimit-Limit"
          },
          "X-RateLimit-Remaining": {
            "$ref": "#/components/headers/X-RateLimit-Remaining"
          },
          "X-RateLimit-Reset": {
            "$ref": "#/components/headers/X-RateLimit-Reset"
          }
        }
      }
    },
    "schemas": {
      "429TooManyRequestsResponse": {
        "description": "Example for a rate-limited request response",
        "properties": {
          "code": {
            "example": "throttled"
          },
          "detail": {
            "example": "Connection refreshed too recently. Please try again later."
          },
          "status_code": {
            "example": 429
          }
        },
        "type": "object"
      },
      "503BrokerageRequestResponse": {
        "description": "Example for a response that failed because of an upstream brokerage API failure",
        "properties": {
          "code": {
            "example": 3002
          },
          "detail": {
            "example": "Unable to sync with brokerage account. Invalid response from Brokerage API."
          },
          "status_code": {
            "example": 503
          }
        },
        "type": "object"
      },
      "Account": {
        "description": "A single account at a brokerage.",
        "properties": {
          "account_category": {
            "description": "The category of the account, normalized across institutions.\nReturns `null` if the category could not be determined. Use this field to filter out non-investment accounts if your integration only supports trading / holdings flows. See [Filtering Accounts by Category](https://docs.snaptrade.com/docs/filtering-accounts-by-category) for more information.\n- `INVESTMENT`: A brokerage / investment account (equities, options, crypto, etc.).\n- `DEPOSIT`: A bank deposit account (checking, savings).\n- `LOC`: A line of credit account.\n",
            "enum": [
              "INVESTMENT",
              "DEPOSIT",
              "LOC"
            ],
            "example": "INVESTMENT",
            "nullable": true,
            "type": "string"
          },
          "balance": {
            "$ref": "#/components/schemas/AccountBalance"
          },
          "brokerage_authorization": {
            "$ref": "#/components/schemas/BrokerageAuthID"
          },
          "cash_restrictions": {
            "deprecated": true,
            "description": "This field is deprecated.",
            "example": [],
            "items": {
              "type": "string"
            },
            "type": "array"
          },
          "created_date": {
            "description": "Timestamp in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format indicating when the account was created in SnapTrade. This is _not_ the account opening date at the brokerage.",
            "example": "2024-07-23T22:50:22.76139Z",
            "format": "date-time",
            "type": "string"
          },
          "funding_date": {
            "description": "Timestamp in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format indicating when the account was funded. Only populated for brokerages that expose this data (Tastytrade, eToro, moomoo, Public, and Unlok); `null` for all other brokerages.",
            "example": "2024-07-25T12:00:00Z",
            "format": "date-time",
            "nullable": true,
            "type": "string"
          },
          "id": {
            "allOf": [
              {
                "$ref": "#/components/schemas/AccountID"
              }
            ],
            "description": "Unique identifier for the connected brokerage account. This is the UUID used to reference the account in SnapTrade. This ID should not change for as long as the connection stays active. If the connection is deleted and re-added, a new account ID will be generated."
          },
          "institution_account_id": {
            "description": "A stable and unique account identifier provided by the institution. Will be set to null if not provided. When present, can be used to check if a user has connected the same brokerage account across multiple connections.",
            "example": "54953432",
            "nullable": true,
            "type": "string"
          },
          "institution_name": {
            "description": "The name of the brokerage that holds the account.",
            "example": "Robinhood",
            "type": "string"
          },
          "is_paper": {
            "description": "Indicates whether the account is a paper (simulated) trading account.",
            "example": false,
            "type": "boolean"
          },
          "meta": {
            "deprecated": true,
            "description": "Additional information about the account, such as account type, status, etc. This information is specific to the brokerage and there's no standard format for this data. This field is deprecated and subject to removal in a future version.",
            "example": {
              "institution_name": "Robinhood",
              "status": "ACTIVE",
              "type": "Margin"
            },
            "type": "object"
          },
          "name": {
            "description": "A display name for the account. Either assigned by the user or by the brokerage itself. For certain brokerages, SnapTrade appends the brokerage name to the account name for clarity.",
            "example": "Robinhood Individual",
            "nullable": true,
            "type": "string"
          },
          "number": {
            "description": "The account number assigned by the brokerage. For some brokerages, this field may be masked for security reasons.",
            "example": "Q6542138443",
            "type": "string"
          },
          "opening_date": {
            "description": "Timestamp in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format indicating when the account was opened at the brokerage. Only populated for brokerages that expose this data (Tastytrade, eToro, moomoo, Public, and Unlok); `null` for all other brokerages.",
            "example": "2024-07-20T09:30:00Z",
            "format": "date-time",
            "nullable": true,
            "type": "string"
          },
          "portfolio_group": {
            "$ref": "#/components/schemas/PortfolioGroupID"
          },
          "raw_type": {
            "description": "The account type as provided by the brokerage",
            "example": "Margin",
            "nullable": true,
            "type": "string"
          },
          "status": {
            "description": "The current status of the account. Can be either \"open\", \"closed\", \"archived\" or null if the status is unknown or not provided by the brokerage.",
            "enum": [
              "open",
              "closed",
              "archived",
              "unavailable"
            ],
            "example": "open",
            "nullable": true,
            "type": "string"
          },
          "sync_status": {
            "$ref": "#/components/schemas/AccountSyncStatus"
          }
        },
        "required": [
          "id",
          "brokerage_authorization",
          "name",
          "number",
          "institution_name",
          "created_date",
          "sync_status",
          "balance",
          "is_paper"
        ],
        "type": "object"
      },
      "AccountBalance": {
        "description": "Contains balance related information for the account.",
        "properties": {
          "total": {
            "description": "Total market value of this account (includes cash, equity, fixed income, etc). This value is directly obtained from the brokerage and should reflect the most accurate value of the account.",
            "nullable": true,
            "properties": {
              "amount": {
                "description": "Total value denominated in the currency of the `currency` field.",
                "example": 15363.23,
                "type": "number"
              },
              "currency": {
                "description": "The ISO-4217 currency code for the amount.",
                "example": "USD",
                "type": "string"
              }
            }
          }
        }
      },
      "AccountID": {
        "description": "Unique identifier for the connected brokerage account. This is the UUID used to reference the account in SnapTrade.",
        "example": "917c8734-8470-4a3e-a18f-57c3f2ee6631",
        "format": "uuid",
        "type": "string"
      },
      "AccountPosition": {
        "description": "Describes a single position.",
        "properties": {
          "cash_equivalent": {
            "description": "Present for mutual fund positions and for other instrument kinds when true. A true value means the position is also counted in cash balance or buying power.",
            "example": false,
            "type": "boolean"
          },
          "cost_basis": {
            "description": "Book price or average purchase price for the position. For options, this is per-share.",
            "example": "118.2",
            "format": "decimal",
            "nullable": true,
            "type": "string"
          },
          "currency": {
            "description": "ISO-4217 currency code for the position `price` and `cost_basis`.",
            "example": "USD",
            "nullable": true,
            "type": "string"
          },
          "instrument": {
            "$ref": "#/components/schemas/Instrument"
          },
          "price": {
            "description": "Last known market price _per share_. The freshness of this price depends on the brokerage. Some brokerages provide real-time prices, while others provide delayed prices. It is recommended that you rely on your own third-party market data provider for most up to date prices.",
            "example": "123.45",
            "format": "decimal",
            "nullable": true,
            "type": "string"
          },
          "tax_lots": {
            "description": "List of tax lots for the given position (disabled by default, only available on paid plans, contact support if needed)",
            "items": {
              "$ref": "#/components/schemas/TaxLot"
            },
            "type": "array"
          },
          "units": {
            "description": "The number of units held in the position. Positive numbers indicate long positions and negative numbers indicate short positions.",
            "example": "10.5",
            "format": "decimal",
            "nullable": true,
            "type": "string"
          }
        },
        "required": [
          "instrument"
        ],
        "type": "object"
      },
      "AccountSyncStatus": {
        "description": "Contains status update for the account sync process between SnapTrade and the brokerage.",
        "properties": {
          "holdings": {
            "$ref": "#/components/schemas/HoldingsStatus"
          },
          "transactions": {
            "$ref": "#/components/schemas/TransactionsStatus"
          }
        }
      },
      "AccountUniversalActivity": {
        "description": "A transaction or activity from an institution",
        "properties": {
          "amount": {
            "description": "The amount of the transaction denominated in `currency`. This can be positive or negative. In general, transactions that positively affect the account balance (like sell, deposits, dividends, etc) will have a positive amount, while transactions that negatively affect the account balance (like buy, withdrawals, fees, etc) will have a negative amount.",
            "example": 263.82,
            "nullable": true,
            "type": "number"
          },
          "currency": {
            "allOf": [
              {
                "$ref": "#/components/schemas/Currency"
              }
            ],
            "description": "The currency in which the transaction `price`, `amount`, and `fee` are denominated. This is `null` when those values are denominated in `currency_universal_symbol`.",
            "nullable": true
          },
          "currency_universal_symbol": {
            "allOf": [
              {
                "$ref": "#/components/schemas/Symbol"
              }
            ],
            "description": "The quote security for the transaction when `price`, `amount`, and `fee` are denominated in a security instead of a fiat currency. This is most common for cryptocurrency trades. The field is `null` when the transaction is denominated in `currency`.",
            "nullable": true
          },
          "description": {
            "description": "A human-readable description of the transaction. This is usually the brokerage's description of the transaction.",
            "example": "WALT DISNEY UNIT DIST ON 21 SHS REC 12/31/21 PAY 01/06/22",
            "type": "string"
          },
          "external_reference_id": {
            "description": "Reference ID from brokerage used to identify related transactions. For example if an order comprises of several transactions (buy, fee, fx), they can be grouped if they share the same `external_reference_id`",
            "example": "2f7dc9b3-5c33-4668-3440-2b31e056ebe6",
            "nullable": true,
            "type": "string"
          },
          "fee": {
            "description": "Any fee associated with the transaction if provided by the brokerage.",
            "example": 0,
            "type": "number"
          },
          "fx_rate": {
            "description": "The forex conversion rate involved in the transaction if provided by the brokerage. Used in cases where securities of one currency are purchased in a different currency, and the forex conversion is automatic. In those cases, price, amount and fee will be in the top level currency (activity -\u003e currency)",
            "example": 1.032,
            "nullable": true,
            "type": "number"
          },
          "id": {
            "description": "Unique identifier for the transaction. This is the ID used to reference the transaction in SnapTrade.\n\nPlease note that this ID _can_ change if the transaction is deleted and re-added. Under normal circumstances, SnapTrade does not delete transactions. The only time this would happen is if SnapTrade re-fetches and reprocesses the data from the brokerage, which is rare. If you require a stable ID, please let us know and we can work with you to provide one.\n",
            "example": "2f7dc9b3-5c33-4668-3440-2b31e056ebe6",
            "type": "string"
          },
          "institution": {
            "description": "The institution that the transaction is associated with. This is usually the brokerage name.",
            "example": "Robinhood",
            "type": "string"
          },
          "option_symbol": {
            "allOf": [
              {
                "$ref": "#/components/schemas/OptionsSymbol"
              }
            ],
            "description": "The option security for the transaction. The field is `null` if the transaction is not related to an option security (like a deposit, withdrawal, fee, etc). SnapTrade does a best effort to map the brokerage's option symbol. In cases where the brokerage option symbol is not recognized, the field will be set to `null`.",
            "nullable": true
          },
          "option_type": {
            "description": "If an option `BUY` or `SELL` transaction, this further specifies the type of action. The possible values are:\n- BUY_TO_OPEN\n- BUY_TO_CLOSE\n- SELL_TO_OPEN\n- SELL_TO_CLOSE\n",
            "example": "BUY_TO_OPEN",
            "type": "string"
          },
          "price": {
            "description": "The price of the security for the transaction. This is mostly applicable to `BUY`, `SELL`, and `DIVIDEND` transactions. For option transactions, this represents the price per share of the option contract.",
            "example": 0.4,
            "type": "number"
          },
          "settlement_date": {
            "description": "The date on which the transaction is settled.",
            "example": "2024-03-26T00:00:00Z",
            "format": "date-time",
            "type": "string"
          },
          "symbol": {
            "allOf": [
              {
                "$ref": "#/components/schemas/Symbol"
              }
            ],
            "description": "The security for the transaction. The field is `null` if the transaction is not related to a security (like a deposit, withdrawal, fee, etc). SnapTrade does a best effort to map the brokerage's symbol. In cases where the brokerage symbol is not recognized, the field will be set to `null`.",
            "nullable": true
          },
          "trade_date": {
            "description": "The recorded time for the transaction. The granularity of this timestamp depends on the brokerage. Some brokerages provide the exact time of the transaction, while others provide only the date. Please check the [integrations page](https://support.snaptrade.com/brokerages-table?v=6fab8012ade6441fa0c6d9af9c55ce3a) for the specific brokerage to see the granularity of the timestamps. Note that even though the field is named `trade_date`, it can represent any type of transaction, not just trades.",
            "example": "2024-03-22T16:27:55Z",
            "format": "date-time",
            "nullable": true,
            "type": "string"
          },
          "type": {
            "description": "A string representing the type of transaction. SnapTrade does a best effort to categorize the brokerage transaction types into a common set of values. Here are some of the most popular values:\n  - `BUY` - Asset bought.\n  - `SELL` - Asset sold.\n  - `DIVIDEND` - Dividend payout.\n  - `SUBSTITUTE_DIVIDEND` - Payment in lieu of a dividend.\n  - `CONTRIBUTION` - Cash contribution.\n  - `WITHDRAWAL` - Cash withdrawal.\n  - `REI` - Dividend reinvestment.\n  - `STOCK_DIVIDEND` - A type of dividend where a company distributes shares instead of cash\n  - `INTEREST` - Interest deposited into the account.\n  - `FEE` - Fee withdrawn from the account.\n  - `TAX` - A tax related fee.\n  - `OPTIONEXPIRATION` - Option expiration event.\n  - `OPTIONASSIGNMENT` - Option assignment event.\n  - `OPTIONEXERCISE` - Option exercise event.\n  - `TRANSFER` - Transfer of asset(s) from one account to another.\n  - `EXTERNAL_ASSET_TRANSFER_IN` - Incoming transfer of an asset from an external account to this account.\n  - `EXTERNAL_ASSET_TRANSFER_OUT` - Outgoing transfer of an asset from this account to an external account.\n  - `SPLIT` - A stock share split.\n  - `ADJUSTMENT` - A one time adjustment of the account's cash balance or shares of an asset\n",
            "example": "BUY",
            "type": "string"
          },
          "units": {
            "description": "The number of units of the security for the transaction. This is mostly applicable to `BUY`, `SELL`, and `DIVIDEND` transactions.",
            "example": 5.2,
            "type": "number"
          }
        },
        "type": "object"
      },
      "AdrInstrument": {
        "description": "Security instrument metadata for ADR positions.",
        "properties": {
          "currency": {
            "description": "ISO-4217 currency code for the security listing.",
            "example": "USD",
            "nullable": true,
            "type": "string"
          },
          "description": {
            "description": "Human-readable description of the security.",
            "example": "Alibaba Group Holding Ltd ADR",
            "nullable": true,
            "type": "string"
          },
          "exchange": {
            "description": "Exchange MIC code or exchange code for the security.",
            "example": "XNYS",
            "nullable": true,
            "type": "string"
          },
          "figi_instrument": {
            "allOf": [
              {
                "$ref": "#/components/schemas/FigiInstrument"
              }
            ],
            "nullable": true
          },
          "id": {
            "description": "Unique identifier for the instrument.",
            "example": "1ef3a5d3-4a9b-40b2-b8d1-cc35f74d6324",
            "format": "uuid",
            "type": "string"
          },
          "kind": {
            "description": "Type of security instrument.",
            "enum": [
              "adr"
            ],
            "example": "adr",
            "type": "string"
          },
          "raw_symbol": {
            "description": "The raw symbol without any exchange suffix.",
            "example": "BABA",
            "type": "string"
          },
          "symbol": {
            "description": "The formatted trading symbol for the security.",
            "example": "BABA",
            "type": "string"
          }
        },
        "required": [
          "kind",
          "id",
          "symbol",
          "raw_symbol"
        ],
        "type": "object"
      },
      "AllAccountPositionsResponse": {
        "description": "Information about all account positions.",
        "properties": {
          "data_freshness": {
            "description": "Metadata describing freshness of the returned positions data.",
            "properties": {
              "as_of": {
                "description": "The time the returned positions data was fetched from the brokerage.",
                "example": "2026-06-02T14:30:00Z",
                "format": "date-time",
                "type": "string"
              }
            },
            "required": [
              "as_of"
            ],
            "type": "object"
          },
          "results": {
            "description": "Positions returned for the request.",
            "items": {
              "$ref": "#/components/schemas/AccountPosition"
            },
            "type": "array"
          }
        },
        "required": [
          "results",
          "data_freshness"
        ],
        "type": "object"
      },
      "Balance": {
        "description": "Holds balance information for a single currency in an account.",
        "properties": {
          "buying_power": {
            "description": "Buying power only applies to margin accounts. For non-margin accounts, buying power should be the same as cash. Please note that this field is not always available for all brokerages.",
            "example": 410.71,
            "nullable": true,
            "type": "number"
          },
          "cash": {
            "description": "The amount of available cash in the account denominated in the currency of the `currency` field. This value can be negative in a margin account with a margin balance. Money market funds will be included in this field, and also returned in positions endpoints with `cash_equivalent` = true",
            "example": 300.71,
            "nullable": true,
            "type": "number"
          },
          "currency": {
            "allOf": [
              {
                "$ref": "#/components/schemas/Currency"
              }
            ],
            "description": "The currency of the balance. This applies to both `cash` and `buying_power`."
          }
        },
        "type": "object"
      },
      "Brokerage": {
        "description": "Describes a brokerage that SnapTrade supports.",
        "properties": {
          "allows_fractional_units": {
            "deprecated": true,
            "description": "This field is deprecated. Please contact us if you have a valid use case for it.",
            "example": true,
            "nullable": true,
            "type": "boolean"
          },
          "allows_trading": {
            "description": "Whether the brokerage allows trading through SnapTrade.",
            "example": true,
            "nullable": true,
            "type": "boolean"
          },
          "aws_s3_logo_url": {
            "description": "URL to the brokerage's logo.",
            "example": "https://passiv-brokerage-logos.s3.ca-central-1.amazonaws.com/robinhood-logo.png",
            "format": "url",
            "type": "string"
          },
          "aws_s3_square_logo_url": {
            "description": "URL to the brokerage's logo in square format.",
            "example": "https://passiv-brokerage-logos.s3.ca-central-1.amazonaws.com/robinhood-logo-square.png",
            "format": "url",
            "nullable": true,
            "type": "string"
          },
          "brokerage_type": {
            "$ref": "#/components/schemas/BrokerageType"
          },
          "description": {
            "description": "A brief description of the brokerage.",
            "example": "Robinhood is an American multinational financial services corporation based in Menlo Park, California.",
            "type": "string"
          },
          "display_name": {
            "description": "A display-friendly name of the brokerage.",
            "example": "Robinhood",
            "type": "string"
          },
          "enabled": {
            "description": "Whether the brokerage is enabled in SnapTrade. A disabled brokerage will not be available for new connections.",
            "example": true,
            "type": "boolean"
          },
          "exchanges": {
            "deprecated": true,
            "description": "This field is deprecated. Please contact us if you have a valid use case for it.",
            "example": [
              "2bcd7cc3-e922-4976-bce1-9858296801c3",
              "4bcd8cc3-c122-4974-dc21-1858296801f4"
            ],
            "items": {},
            "type": "array"
          },
          "has_reporting": {
            "deprecated": true,
            "description": "This field is deprecated. Please contact us if you have a valid use case for it.",
            "example": true,
            "nullable": true,
            "type": "boolean"
          },
          "id": {
            "description": "Unique identifier for the brokerage firm. This is the UUID used to reference the brokerage in SnapTrade.",
            "example": "ebf91a5b-0920-4266-9e36-f6cfe8c40946",
