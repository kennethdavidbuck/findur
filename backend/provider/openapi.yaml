      },
      "BrokerageAuthorization": {
        "description": "A single connection with a brokerage. Note that `Connection` and `Brokerage Authorization` are interchangeable, but the term `Connection` is preferred and used in the doc for consistency.\n\nA connection is usually tied to a single login at a brokerage. A single connection can contain multiple brokerage accounts.\n\nSnapTrade performs de-duping on connections for a given user. If the user has an existing connection with the brokerage, when connecting the brokerage with the same credentials, SnapTrade will return the existing connection instead of creating a new one.\n",
        "properties": {
          "brokerage": {
            "$ref": "#/components/schemas/Brokerage"
          },
          "created_date": {
            "description": "Timestamp of when the connection was established in SnapTrade.",
            "example": "2024-08-20T21:56:19.123935Z",
            "format": "date-time",
            "type": "string"
          },
          "data_freshness_mode": {
            "additionalProperties": false,
            "description": "Indicates the data freshness provided by the institution and by SnapTrade for this connection. The two values are independent; the connection's data is effectively delayed if either value is `delayed`.\n\nThe \"Data freshness\" column on the [SnapTrade Institution Support](https://support.snaptrade.com/brokerages) page (Positions \u0026 recent orders tab) identifies institutions whose connections are considered delayed on a Real-time plan because either `institution` or `snaptrade` is `delayed`.\n",
            "example": {
              "institution": "realtime",
              "snaptrade": "delayed"
            },
            "properties": {
              "institution": {
                "description": "Indicates the freshness of the data provided by the institution. `realtime` means the institution provides current data; `delayed` means the institution itself does not allow intra-day data updates.\n",
                "enum": [
                  "realtime",
                  "delayed"
                ],
                "type": "string"
              },
              "snaptrade": {
                "description": "Indicates how SnapTrade retrieves data for this connection. `realtime` means SnapTrade retrieves current data from the institution during API calls. `delayed` means SnapTrade serves cached data, either because the customer's plan uses Daily data or because retrieving live data from the institution is too latency-intensive.\n\nWhen this value is `delayed`, you can request updated data using the [manual refresh endpoint](/reference/Connections/Connections_refreshBrokerageAuthorization).\n",
                "enum": [
                  "realtime",
                  "delayed"
                ],
                "type": "string"
              }
            },
            "required": [
              "institution",
              "snaptrade"
            ],
            "type": "object"
          },
          "disabled": {
            "description": "Whether the connection is disabled. A disabled connection can no longer access the latest data from the brokerage, but will continue to return the last cached state. A connection can become disabled for many reasons and differs by brokerage. Here are some common scenarios:\n\n- The user has changed their username or password at the brokerage.\n- The user has explicitly removed the access grant at the brokerage.\n- The session has expired at the brokerage and now requires explicit user re-authentication.\n\nPlease see [this guide](/docs/fix-broken-connections) on how to fix a disabled connection.\n",
            "example": false,
            "type": "boolean"
          },
          "disabled_date": {
            "description": "Timestamp of when the connection was disabled in SnapTrade.",
            "example": "2022-01-21T15:11:19.217-05:00",
            "format": "date-time",
            "nullable": true,
            "type": "string"
          },
          "id": {
            "$ref": "#/components/schemas/BrokerageAuthID"
          },
          "is_eligible_for_payout": {
            "description": "Whether the connection is eligible for a payout. This is an experimental field that is NOT generally available for all partners. Do not use in production without speaking to the SnapTrade team.",
            "example": true,
            "type": "boolean"
          },
          "meta": {
            "deprecated": true,
            "description": "Additional data about the connection. This information is specific to the brokerage and there's no standard format for this data. This field is deprecated and subject to removal in a future version.",
            "example": {
              "identifier": 123456
            },
            "type": "object"
          },
          "name": {
            "description": "A short, human-readable name for the connection.",
            "example": "Connection-1",
            "type": "string"
          },
          "type": {
            "description": "Whether the connection is read-only or trade-enabled. A read-only connection can only be used to fetch data, while a trade-enabled connection can be used to place trades. Valid values are `read` and `trade`.",
            "example": "trade",
            "type": "string"
          },
          "updated_date": {
            "deprecated": true,
            "description": "Timestamp of when the connection was last updated in SnapTrade. This field is deprecated. Please let us know if you have a valid use case for this field.",
            "example": "2024-08-20T21:56:20.057224Z",
            "format": "date-time",
            "type": "string"
          }
        },
        "type": "object"
      },
