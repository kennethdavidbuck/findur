        "properties": {
          "account_category": {
            "description": "The category of the account, normalized across institutions.\nReturns `null` if the category could not be determined. Use this field to filter out non-investment accounts if your integration only supports trading / holdings flows. See [Filtering Accounts by Category](https://docs.snaptrade.com/docs/filtering-accounts-by-category) for more information.\n- `INVESTMENT`: A brokerage / investment account (equities, options, crypto, etc.).\n- `DEPOSIT`: A bank deposit account (checking, savings).\n- `LOC`: A line of credit account.\n",
            "enum": [
              "INVESTMENT",
              "DEPOSIT",
              "LOC"
            ],
            "example": "INVESTMENT",
            "nullable": true,
            "type": "string"
          },
