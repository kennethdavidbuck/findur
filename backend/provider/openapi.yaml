  "openapi": "3.0.0",
  "paths": {
    "/accounts": {
      "get": {
        "description": "Returns all brokerage accounts across all connections known to SnapTrade for the authenticated user.\n\nThis endpoint returns Daily data regardless of the customer's plan. Daily data is cached and refreshed once a day, which makes this endpoint fast and well-suited to listing accounts across all of a user's connections in a single call. Exact refresh timing may vary by brokerage. To get real-time data on Pay as you Go / Real-time, use the [list accounts for a connection endpoint](/reference/Connections/Connections_listBrokerageAuthorizationAccounts). Customers on Pay as you Go / Daily can force a refresh with the [manual refresh endpoint](/reference/Connections/Connections_refreshBrokerageAuthorization).\n",
        "operationId": "AccountInformation_listUserAccounts",
        "parameters": [],
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "description": "List of brokerage accounts across all connections.",
                  "items": {
                    "$ref": "#/components/schemas/Account"
                  },
                  "type": "array"
                }
              }
            },
            "description": "OK"
          },
          "default": {
            "description": "Unexpected error."
          }
        },
        "security": [
          {
            "OAuthBearer": []
          }
        ],
        "summary": "List user accounts",
        "tags": [
          "Account Information"
        ]
      }
    },
    "/accounts/{accountId}/activities": {
      "get": {
        "description": "This endpoint is not deprecated and has no planned sunset. Responses to requests using the legacy `/api/v1` path prefix include `Deprecation: @1781222400` (June 12, 2026); that header applies only to the path prefix. Use the canonical root path `/accounts/{accountId}/activities`.\n\nReturns all historical transactions for the specified account.\n\nThis endpoint is paginated with a default page size of 1000. The endpoint will return a maximum of 1000 transactions per request. See the query parameters for pagination options.\n\nTransaction are returned in reverse chronological order, using the `trade_date` field.\n\nThis endpoint returns Daily data. Daily data is cached and refreshed once a day. Exact refresh timing may vary by brokerage.\n\nIf the connection has become disabled, it can no longer access the latest data from the brokerage, but will continue to return the last available cached state. Please see [this guide](/docs/fix-broken-connections) on how to fix a disabled connection.\n",
        "operationId": "AccountInformation_getAccountActivities",
        "parameters": [
          {
            "in": "path",
            "name": "accountId",
            "required": true,
            "schema": {
              "$ref": "#/components/schemas/AccountID"
            }
          },
          {
            "description": "The start date (inclusive) of the transaction history to retrieve. If not provided, the default is the first transaction known to SnapTrade based on `trade_date`.",
            "in": "query",
            "name": "startDate",
            "required": false,
            "schema": {
              "$ref": "#/components/schemas/ReportingDate"
            }
          },
          {
            "description": "The end date (inclusive) of the transaction history to retrieve. If not provided, the default is the last transaction known to SnapTrade based on `trade_date`.",
            "in": "query",
            "name": "endDate",
            "required": false,
            "schema": {
              "$ref": "#/components/schemas/ReportingDate"
            }
          },
          {
            "description": "An integer that specifies the starting point of the paginated results. Default is 0.",
            "in": "query",
            "name": "offset",
            "required": false,
            "schema": {
              "format": "int32",
              "minimum": 0,
              "type": "integer"
            }
          },
          {
            "description": "An integer that specifies the maximum number of transactions to return. Default of 1000.",
            "in": "query",
            "name": "limit",
            "required": false,
            "schema": {
              "format": "int32",
              "minimum": 1,
              "type": "integer"
            }
          },
          {
            "description": "Optional comma separated list of transaction types to filter by. SnapTrade does a best effort to categorize brokerage transaction types into a common set of values. Here are some of the most popular values:\n  - `BUY` - Asset bought.\n  - `SELL` - Asset sold.\n  - `DIVIDEND` - Dividend payout.\n  - `SUBSTITUTE_DIVIDEND` - Payment in lieu of a dividend.\n  - `CONTRIBUTION` - Cash contribution.\n  - `WITHDRAWAL` - Cash withdrawal.\n  - `REI` - Dividend reinvestment.\n  - `STOCK_DIVIDEND` - A type of dividend where a company distributes shares instead of cash\n  - `INTEREST` - Interest deposited into the account.\n  - `FEE` - Fee withdrawn from the account.\n  - `TAX` - A tax related fee.\n  - `OPTIONEXPIRATION` - Option expiration event.\n  - `OPTIONASSIGNMENT` - Option assignment event.\n  - `OPTIONEXERCISE` - Option exercise event.\n  - `TRANSFER` - Transfer of assets from one account to another.\n  - `SPLIT` - A stock share split.\n",
            "in": "query",
            "name": "type",
            "required": false,
            "schema": {
              "example": "BUY,SELL,DIVIDEND",
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PaginatedUniversalActivity"
                }
              }
            },
            "description": "OK"
          },
          "429": {
            "$ref": "#/components/responses/TooManyRequests"
          },
          "default": {
            "description": "Unexpected error"
          }
        },
        "security": [
          {
            "OAuthBearer": []
          }
        ],
        "summary": "List account activities",
        "tags": [
          "Account Information"
        ]
      }
    },
    "/accounts/{accountId}/balances": {
      "get": {
        "description": "Returns a list of balances for the account. Each element of the list has a distinct currency. Some brokerages like Questrade [allows holding multiple currencies in the same account](https://www.questrade.com/learning/questrade-basics/balances-and-reports/understanding-your-account-balances).\n\nCheck your API key on the [Customer Dashboard billing page](https://dashboard.snaptrade.com/settings/billing) to see if you have real-time data access:\n  - If you do, this endpoint returns real-time data.\n  - If you don't, Daily data is cached and refreshed once a day. Exact refresh timing may vary by brokerage. If you need real-time, use the [manual refresh](/reference/Connections/Connections_refreshBrokerageAuthorization) endpoint.\n\nIf the connection has become disabled, it can no longer access the latest data from the brokerage, but will continue to return the last available cached state. Please see [this guide](/docs/fix-broken-connections) on how to fix a disabled connection.\n",
        "operationId": "AccountInformation_getUserAccountBalance",
        "parameters": [
          {
            "in": "path",
            "name": "accountId",
            "required": true,
            "schema": {
              "$ref": "#/components/schemas/AccountID"
            }
          }
        ],
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "items": {
                    "$ref": "#/components/schemas/Balance"
                  },
                  "type": "array"
                }
              }
            },
            "description": "OK"
          },
          "429": {
            "$ref": "#/components/responses/TooManyRequests"
          },
          "503": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/503BrokerageRequestResponse"
                }
              }
            },
            "description": "Service Unavailable - the brokerage connection is busy syncing (sync lock held) or the brokerage API is temporarily unavailable, and no cached fallback was available. Safe to retry."
          },
          "default": {
            "description": "Unexpected error"
          }
        },
        "security": [
          {
            "OAuthBearer": []
          }
        ],
        "summary": "List account balances",
        "tags": [
          "Account Information"
        ]
      }
    },
    "/accounts/{accountId}/positions/all": {
      "get": {
        "description": "Returns a list of all positions in the specified account.\n\nThe `results` list can contain multiple instrument types in the same response, including stocks, ADRs, ETFs, mutual funds, closed-end funds, bonds, crypto, futures, option positions, future option positions, CFD positions, and tokenized asset positions. Use the `instrument.kind` discriminator to determine the schema for each position's `instrument`.\n\n**Beta:** future option positions (`instrument.kind: future_option`) are in beta. They are currently returned only for tastytrade and Interactive Brokers connections, and only for partners they have been enabled for — please contact the SnapTrade team to enable them. The `FutureOptionInstrument` schema may change.\n\nPositions counted in account cash balance or buying power include `cash_equivalent: true`. `stock`, `adr`, `etf`, `mutualfund`, and `crypto` positions may include `tax_lots` when tax lot data is enabled for the account. To see which institutions support tax lot data, please see our [supported institutions doc](https://support.snaptrade.com/brokerages).\n\nIf the connection has become disabled, it can no longer access the latest data from the brokerage, but will continue to return the last available cached state. Please see [this guide](/docs/fix-broken-connections) on how to fix a disabled connection.\n",
        "operationId": "AccountInformation_getAllAccountPositions",
        "parameters": [
          {
            "in": "path",
            "name": "accountId",
            "required": true,
            "schema": {
              "$ref": "#/components/schemas/AccountID"
            }
          }
        ],
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AllAccountPositionsResponse"
                }
              }
            },
            "description": "OK"
          },
          "429": {
            "$ref": "#/components/responses/TooManyRequests"
          },
          "503": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/503BrokerageRequestResponse"
                }
              }
            },
            "description": "Service Unavailable - the brokerage connection is busy syncing (sync lock held) or the brokerage API is temporarily unavailable, and no cached fallback was available. Safe to retry."
          },
          "default": {
            "description": "Unexpected error"
          }
        },
        "security": [
          {
            "OAuthBearer": []
          }
        ],
        "summary": "List all account positions",
        "tags": [
          "Account Information"
        ]
      }
    },
    "/authorizations": {
      "get": {
        "description": "Returns a list of all connections for the specified user. Note that `Connection` and `Brokerage Authorization` are interchangeable, but the term `Connection` is preferred and used in the doc for consistency.\n\nA connection is usually tied to a single login at a brokerage. A single connection can contain multiple brokerage accounts.\n\nSnapTrade performs de-duping on connections for a given user. If the user has an existing connection with the brokerage, when connecting the brokerage with the same credentials, SnapTrade will return the existing connection instead of creating a new one.\n",
        "operationId": "Connections_listBrokerageAuthorizations",
        "parameters": [],
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "description": "A list of all connections for the specified user.",
                  "items": {
                    "$ref": "#/components/schemas/BrokerageAuthorization"
                  },
                  "type": "array"
                }
              }
            },
            "description": "OK"
          },
          "default": {
            "description": "Unexpected error."
          }
        },
        "security": [
          {
            "OAuthBearer": []
          }
        ],
        "summary": "List all connections",
        "tags": [
          "Connections"
        ]
      }
    }
  },
  "security": [
    {
      "OAuthBearer": []
    }
  ],
  "servers": [
    {
      "description": "SnapTrade Production API",
      "url": "https://api.snaptrade.com"
    }
  ]
}
