openapi: 3.1.0
info:
  title: Findur API
  version: 0.4.0
paths:
  /api/auth/logout:
    post:
      operationId: logoutCurrentSession
      summary: Revoke the authenticated browser session
      parameters:
        - in: header
          name: X-CSRF-Token
          schema: { type: string, minLength: 1 }
      responses:
        '204':
          description: Current session revoked and browser cookies expired
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: 'private, no-store' }
            Set-Cookie:
              required: true
              schema:
                type: array
                items: { type: string }
        '401':
          $ref: '#/components/responses/LogoutUnauthorized'
        '403':
          $ref: '#/components/responses/LogoutForbidden'
  /api/auth/status:
    get:
      operationId: getAuthorizationStatus
      summary: Report categorical authorization availability and session state
      responses:
        '200':
          description: Browser-safe authorization capability and authentication state
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationStatus'
  /api/auth/snaptrade/authorize:
    post:
      operationId: beginSnapTradeAuthorization
      summary: Begin a short-lived hosted SnapTrade authorization attempt
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeginAuthorizationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BeginAuthorizationRequest'
      responses:
        '303':
          description: Redirect to the discovered hosted authorization endpoint
          headers:
            Location:
              required: true
              schema: { type: string, format: uri }
            Set-Cookie:
              required: true
              schema: { type: string }
        '400':
          $ref: '#/components/responses/SafeError'
        '415':
          $ref: '#/components/responses/SafeError'
        '503':
          $ref: '#/components/responses/SafeError'
  /api/auth/snaptrade/callback:
    get:
      operationId: completeSnapTradeAuthorization
      summary: Consume a single-use hosted authorization callback
      parameters:
        - in: query
          name: code
          description: Single-use authorization code returned on provider success.
          schema: { type: string, minLength: 1 }
        - in: query
          name: state
          description: Opaque correlation state issued by Findur.
          schema: { type: string, minLength: 1 }
        - in: query
          name: error
          description: Provider error category returned instead of a code.
          schema: { type: string, minLength: 1 }
        - in: query
          name: error_description
          description: Provider detail accepted for protocol compatibility and intentionally ignored.
          schema: { type: string }
      responses:
        '303':
          description: Redirect to a clean, categorical browser result
          headers:
            Location:
              required: true
              schema: { type: string }
            Set-Cookie:
              required: true
              schema:
                type: array
                items: { type: string }
        '400':
          $ref: '#/components/responses/SafeError'
components:
  schemas:
    AuthorizationStatus:
      type: object
      additionalProperties: false
      required: [authorizationAvailable, authenticated]
      properties:
        authorizationAvailable: { type: boolean }
        authenticated: { type: boolean }
    BeginAuthorizationRequest:
      type: object
      additionalProperties: false
      properties:
        returnTo:
          type: string
    Error:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          enum: [invalid_request, authorization_unavailable, initialization_failed, restart_required, unauthenticated, forbidden]
  responses:
    LogoutUnauthorized:
      description: The presented session is not active
      headers:
        Cache-Control:
          required: true
          schema: { type: string, const: 'private, no-store' }
        Set-Cookie:
          required: true
          schema:
            type: array
            items: { type: string }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    LogoutForbidden:
      description: A session request defense failed
      headers:
        Cache-Control:
          required: true
          schema: { type: string, const: 'private, no-store' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    SafeError:
      description: Categorical, non-sensitive failure
      headers:
        Cache-Control:
          required: true
          schema: { type: string, const: no-store }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
