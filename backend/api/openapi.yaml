openapi: 3.1.0
info:
  title: Findur API
  version: 0.5.0
paths:
  /api/preferences/display:
    get:
      operationId: getDisplayPreferences
      summary: Return the authenticated owner's display preferences
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Owner-private display preferences
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: 'private, no-store' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisplayPreferences' }
        '204':
          description: The owner has not saved display preferences yet
        '401': { $ref: '#/components/responses/ProfileUnauthorized' }
        '503': { $ref: '#/components/responses/ProfileUnavailable' }
    put:
      operationId: putDisplayPreferences
      summary: Create or replace the authenticated owner's display preferences
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string, minLength: 1 }
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DisplayPreferencesInput' }
      responses:
        '200':
          description: Saved owner-private display preferences
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: 'private, no-store' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisplayPreferences' }
        '400': { $ref: '#/components/responses/ProfileValidation' }
        '401': { $ref: '#/components/responses/ProfileUnauthorized' }
        '403': { $ref: '#/components/responses/ProfileForbidden' }
        '409': { $ref: '#/components/responses/ProfileConflict' }
        '503': { $ref: '#/components/responses/ProfileUnavailable' }
  /api/portfolio/showcase:
    get:
      operationId: getPortfolioShowcase
      summary: Return the authenticated owner's persisted portfolio showcase
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Owner-private committed dataset heads without provider reads
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: 'private, no-store' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortfolioShowcase' }
        '401': { $ref: '#/components/responses/InventoryUnauthorized' }
        '503': { $ref: '#/components/responses/SafeError' }
  /api/profile:
    get:
      operationId: getPersonalProfile
      summary: Return the authenticated owner's personal profile and safe catalogues
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Owner-private profile state
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: 'private, no-store' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalProfileSnapshot' }
        '401': { $ref: '#/components/responses/ProfileUnauthorized' }
        '503': { $ref: '#/components/responses/ProfileUnavailable' }
    put:
      operationId: putPersonalProfile
      summary: Atomically create or replace the authenticated owner's complete personal profile
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string, minLength: 1 }
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonalProfileInput' }
      responses:
        '200':
          description: Saved owner-private profile
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: 'private, no-store' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalProfile' }
        '400': { $ref: '#/components/responses/ProfileValidation' }
        '401': { $ref: '#/components/responses/ProfileUnauthorized' }
        '403': { $ref: '#/components/responses/ProfileForbidden' }
        '409': { $ref: '#/components/responses/ProfileConflict' }
        '503': { $ref: '#/components/responses/ProfileUnavailable' }
  /api/portfolio/inventory:
    get:
      operationId: getPortfolioInventory
      summary: Return or bootstrap the authenticated owner's masked inventory
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Persisted categorical inventory state
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: 'private, no-store' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortfolioInventory' }
        '401': { $ref: '#/components/responses/InventoryUnauthorized' }
        '503': { $ref: '#/components/responses/SafeError' }
  /api/portfolio/inventory/retry:
    post:
      operationId: retryPortfolioInventory
      summary: Explicitly retry the authenticated owner's inventory bootstrap
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string, minLength: 1 }
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Persisted categorical inventory state after the bounded retry
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: 'private, no-store' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortfolioInventory' }
        '401': { $ref: '#/components/responses/InventoryUnauthorized' }
        '403': { $ref: '#/components/responses/InventoryForbidden' }
        '503': { $ref: '#/components/responses/SafeError' }
  /api/portfolio/inclusion:
    get:
      operationId: getPortfolioInclusion
      summary: Return the authenticated owner's committed and pending account inclusion
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Owner-private account inclusion state
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: 'private, no-store' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortfolioInclusion' }
        '401': { $ref: '#/components/responses/InventoryUnauthorized' }
        '503': { $ref: '#/components/responses/SafeError' }
    post:
      operationId: confirmPortfolioInclusion
      summary: Confirm the authenticated owner's complete target account set
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string, minLength: 1 }
        - in: header
          name: X-Inclusion-Version
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmInclusionRequest'
      responses:
        '200':
          description: The replayed, pending, failed, or committed inclusion result
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: 'private, no-store' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortfolioInclusion' }
        '401': { $ref: '#/components/responses/InventoryUnauthorized' }
        '403': { $ref: '#/components/responses/InventoryForbidden' }
        '409': { $ref: '#/components/responses/InclusionConflict' }
        '503': { $ref: '#/components/responses/SafeError' }
  /api/auth/logout:
    post:
      operationId: logoutCurrentSession
      summary: Revoke the authenticated browser session
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string, minLength: 1 }
      security:
        - SessionCookie: []
      responses:
        '204':
          description: Current session revoked and browser cookies expired
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: 'private, no-store' }
            Set-Cookie:
              required: true
              schema:
                type: array
                items: { type: string }
        '401':
          $ref: '#/components/responses/LogoutUnauthorized'
        '403':
          $ref: '#/components/responses/LogoutForbidden'
  /api/auth/status:
    get:
      operationId: getAuthorizationStatus
      summary: Report categorical authorization availability and session state
      responses:
        '200':
          description: Browser-safe authorization capability and authentication state
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationStatus'
  /api/auth/snaptrade/authorize:
    post:
      operationId: beginSnapTradeAuthorization
      summary: Begin a short-lived hosted SnapTrade authorization attempt
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeginAuthorizationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BeginAuthorizationRequest'
      responses:
        '303':
          description: Redirect to the discovered hosted authorization endpoint
          headers:
            Location:
              required: true
              schema: { type: string, format: uri }
            Set-Cookie:
              required: true
              schema: { type: string }
        '400':
          $ref: '#/components/responses/SafeError'
        '415':
          $ref: '#/components/responses/SafeError'
        '503':
          $ref: '#/components/responses/SafeError'
  /api/auth/snaptrade/callback:
    get:
      operationId: completeSnapTradeAuthorization
      summary: Consume a single-use hosted authorization callback
      parameters:
        - in: query
          name: code
          description: Single-use authorization code returned on provider success.
          schema: { type: string, minLength: 1 }
        - in: query
          name: state
          description: Opaque correlation state issued by Findur.
          schema: { type: string, minLength: 1 }
        - in: query
          name: error
          description: Provider error category returned instead of a code.
          schema: { type: string, minLength: 1 }
        - in: query
          name: error_description
          description: Provider detail accepted for protocol compatibility and intentionally ignored.
          schema: { type: string }
      responses:
        '303':
          description: Redirect to a clean, categorical browser result
          headers:
            Location:
              required: true
              schema: { type: string }
            Set-Cookie:
              required: true
              schema:
                type: array
                items: { type: string }
        '400':
          $ref: '#/components/responses/SafeError'
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: findur_session
  schemas:
    ProfileLocation:
      type: object
      additionalProperties: false
      required: [key, cityEn, cityFr, provinceEn, provinceFr]
      properties:
        key: { type: string }
        cityEn: { type: string }
        cityFr: { type: string }
        provinceEn: { type: string }
        provinceFr: { type: string }
    PersonalProfile:
      type: object
      additionalProperties: false
      required: [displayName, adultAttestedAt, locationKey, relationshipIntent, biography, avatarKey, locale, theme, version]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 60 }
        adultAttestedAt: { type: string, format: date-time }
        locationKey: { type: string }
        relationshipIntent: { type: string, enum: [long-term, open-to-long-term, figuring-it-out] }
        biography: { type: string, minLength: 1, maxLength: 500 }
        avatarKey: { type: string, enum: [aurora, cedar, ember, harbour, meadow, solstice] }
        locale: { type: string, enum: [en, fr] }
        theme: { type: string, enum: [system, light, dark] }
        version: { type: integer, format: int64, minimum: 1 }
    DisplayPreferences:
      type: object
      additionalProperties: false
      required: [locale, theme, version]
      properties:
        locale: { type: string, enum: [en, fr] }
        theme: { type: string, enum: [system, light, dark] }
        version: { type: integer, format: int64, minimum: 1 }
    DisplayPreferencesInput:
      type: object
      additionalProperties: false
      required: [locale, theme, expectedVersion]
      properties:
        locale: { type: string, enum: [en, fr] }
        theme: { type: string, enum: [system, light, dark] }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
    PersonalProfileSnapshot:
      type: object
      additionalProperties: false
      required: [locations]
      properties:
        profile: { $ref: '#/components/schemas/PersonalProfile' }
        locations:
          type: array
          items: { $ref: '#/components/schemas/ProfileLocation' }
    PersonalProfileInput:
      type: object
      additionalProperties: false
      required: [displayName, adultAttested, locationKey, relationshipIntent, biography, avatarKey, locale, theme, expectedVersion]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 60 }
        adultAttested: { type: boolean, const: true }
        locationKey: { type: string }
        relationshipIntent: { type: string, enum: [long-term, open-to-long-term, figuring-it-out] }
        biography: { type: string, minLength: 1, maxLength: 500 }
        avatarKey: { type: string, enum: [aurora, cedar, ember, harbour, meadow, solstice] }
        locale: { type: string, enum: [en, fr] }
        theme: { type: string, enum: [system, light, dark] }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
    ProfileValidationError:
      type: object
      additionalProperties: false
      required: [code, fields]
      properties:
        code: { type: string, const: invalid_profile }
        fields:
          type: array
          uniqueItems: true
          items: { type: string, enum: [displayName, adultAttested, locationKey, relationshipIntent, biography, avatarKey, locale, theme, expectedVersion] }
    InventoryState:
      type: string
      enum: [pending, ready, empty, disabled, unauthorized, rate_limited, unavailable, malformed]
    ResourceDiagnosticReason:
      type: string
      enum: [no_accounts_returned, no_supported_accounts, connection_disabled, authorization_required, provider_unavailable, sync_pending, unknown]
    ResourceDiagnostic:
      type: object
      additionalProperties: false
      required: [reason, recommendedAction]
      properties:
        reason: { $ref: '#/components/schemas/ResourceDiagnosticReason' }
        recommendedAction: { type: string, enum: [none, wait, retry, reconnect] }
        retryAt: { type: string, format: date-time }
        lastSuccessfulAt: { type: string, format: date-time }
    InventoryAccount:
      type: object
      additionalProperties: false
      required: [id, category, type, maskedLabel, available, eligible, selectable, usabilityReason, syncState]
      properties:
        id: { type: string }
        category: { type: string, enum: [investment, deposit, credit, unknown] }
        type: { type: string }
        maskedLabel: { type: string }
        available: { type: boolean }
        eligible: { type: boolean }
        selectable: { type: boolean }
        usabilityReason:
          type: string
          enum: [ready, provisional_status, provisional_category, sync_pending, connection_disabled, connection_unavailable, account_closed, account_unavailable, unsupported_category, sync_unavailable]
        syncState: { type: string, enum: [complete, pending, unavailable, unknown] }
    InventoryConnection:
      type: object
      additionalProperties: false
      required: [id, brokerageLabel, status, syncMode, available, eligible, accounts]
      properties:
        id: { type: string }
        brokerageLabel: { type: string }
        status: { type: string, enum: [active, disabled, unavailable] }
        syncMode: { type: string, enum: [realtime, delayed, unknown] }
        available: { type: boolean }
        eligible: { type: boolean }
        diagnostic: { $ref: '#/components/schemas/ResourceDiagnostic' }
        accounts:
          type: array
          items: { $ref: '#/components/schemas/InventoryAccount' }
    PortfolioInventory:
      type: object
      additionalProperties: false
      required: [state, generation, updatedAt, connections]
      properties:
        state: { $ref: '#/components/schemas/InventoryState' }
        generation: { type: integer, format: int64, minimum: 1 }
        retryAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        connections:
          type: array
          items: { $ref: '#/components/schemas/InventoryConnection' }
    DatasetContext:
      type: object
      additionalProperties: false
      required: [source, coverage, currency, freshness]
      properties:
        source: { type: string }
        coverage: { type: string }
        currency: { type: string }
        observedAt: { type: string, format: date-time }
        retrievedAt: { type: string, format: date-time }
        publishedAt: { type: string, format: date-time }
        freshness: { type: string, enum: [current, stale_usable, expired, unavailable] }
        diagnostic: { $ref: '#/components/schemas/ResourceDiagnostic' }
    ShowcaseBalance:
      type: object
      additionalProperties: false
      required: [currency]
      properties:
        currency: { type: string }
        cash: { type: string }
        buyingPower: { type: string }
    ShowcasePosition:
      type: object
      additionalProperties: false
      required: [symbol, kind, currency]
      properties:
        symbol: { type: string }
        kind: { type: string }
        currency: { type: string }
        units: { type: string }
        price: { type: string }
        costBasis: { type: string }
    ShowcaseActivity:
      type: object
      additionalProperties: false
      required: [type, currency]
      properties:
        type: { type: string }
        currency: { type: string }
        tradeDate: { type: string, format: date-time }
        amount: { type: string }
        fee: { type: string }
        price: { type: string }
        units: { type: string }
    ShowcaseDataset:
      type: object
      additionalProperties: false
      required: [context, balances, positions, activities]
      properties:
        context: { $ref: '#/components/schemas/DatasetContext' }
        balances: { type: array, items: { $ref: '#/components/schemas/ShowcaseBalance' } }
        positions: { type: array, items: { $ref: '#/components/schemas/ShowcasePosition' } }
        activities: { type: array, items: { $ref: '#/components/schemas/ShowcaseActivity' } }
    ShowcaseAccount:
      type: object
      additionalProperties: false
      required: [label, brokerage, syncMode, balances, positions, activities]
      properties:
        label: { type: string }
        brokerage: { type: string }
        syncMode: { type: string, enum: [realtime, delayed, unknown] }
        balances: { $ref: '#/components/schemas/ShowcaseDataset' }
        positions: { $ref: '#/components/schemas/ShowcaseDataset' }
        activities: { $ref: '#/components/schemas/ShowcaseDataset' }
    PortfolioShowcase:
      type: object
      additionalProperties: false
      required: [accounts]
      properties:
        accounts: { type: array, items: { $ref: '#/components/schemas/ShowcaseAccount' } }
    InclusionChange:
      type: object
      additionalProperties: false
      required: [id, status, additions, removals]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, committed, failed] }
        additions:
          type: array
          items: { type: string }
        removals:
          type: array
          items: { type: string }
        failureReason:
          type: string
          enum: [authorization_required, rate_limited, provider_unavailable, unusable_data, stale_guard]
    PortfolioInclusion:
      type: object
      additionalProperties: false
      required: [version, committed]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        committed:
          type: array
          items: { type: string }
        change: { $ref: '#/components/schemas/InclusionChange' }
    ConfirmInclusionRequest:
      type: object
      additionalProperties: false
      required: [accountIds]
      properties:
        accountIds:
          type: array
          maxItems: 5
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 128 }
    AuthorizationStatus:
      type: object
      additionalProperties: false
      required: [authorizationAvailable, authenticated]
      properties:
        authorizationAvailable: { type: boolean }
        authenticated: { type: boolean }
    BeginAuthorizationRequest:
      type: object
      additionalProperties: false
      properties:
        returnTo:
          type: string
    Error:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          enum: [invalid_request, authorization_unavailable, initialization_failed, restart_required, unauthenticated, forbidden, conflict, invalid_selection, invalid_profile]
  responses:
    ProfileValidation:
      description: The complete profile failed bounded validation
      headers:
        Cache-Control:
          required: true
          schema: { type: string, const: 'private, no-store' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProfileValidationError' }
    ProfileUnauthorized:
      description: The presented session is not active
      headers:
        Cache-Control:
          required: true
          schema: { type: string, const: 'private, no-store' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ProfileForbidden:
      description: A session request defense failed
      headers:
        Cache-Control:
          required: true
          schema: { type: string, const: 'private, no-store' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ProfileConflict:
      description: The expected profile version is stale
      headers:
        Cache-Control:
          required: true
          schema: { type: string, const: 'private, no-store' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InventoryUnauthorized:
      description: The presented session is not active
      headers:
        Cache-Control:
          required: true
          schema: { type: string, const: 'private, no-store' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InventoryForbidden:
      description: A session request defense failed
      headers:
        Cache-Control:
          required: true
          schema: { type: string, const: 'private, no-store' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InclusionConflict:
      description: Version, idempotency, or selection conflict with no account disclosure
      headers:
        Cache-Control:
          required: true
          schema: { type: string, const: 'private, no-store' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    LogoutUnauthorized:
      description: The presented session is not active
      headers:
        Cache-Control:
          required: true
          schema: { type: string, const: 'private, no-store' }
        Set-Cookie:
          required: true
          schema:
            type: array
            items: { type: string }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ProfileUnavailable:
      description: The owner-private profile is temporarily unavailable
      headers:
        Cache-Control:
          required: true
          schema: { type: string, const: 'private, no-store' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    LogoutForbidden:
      description: A session request defense failed
      headers:
        Cache-Control:
          required: true
          schema: { type: string, const: 'private, no-store' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    SafeError:
      description: Categorical, non-sensitive failure
      headers:
        Cache-Control:
          required: true
          schema: { type: string, const: no-store }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
