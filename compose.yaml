name: findur

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: findur
      POSTGRES_USER: findur
      POSTGRES_PASSWORD: synthetic-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findur -d findur"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql

  wiremock:
    image: wiremock/wiremock:3.13.2
    command: ["--disable-banner", "--disable-gzip", "--global-response-templating"]
    volumes:
      - ./test/fixtures/wiremock:/home/wiremock:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/__admin/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: findur-backend:${BUILD_SHA:-0123456789abcdef0123456789abcdef01234567}
    platform: linux/amd64
    build:
      context: .
      target: backend
      args:
        BUILD_SHA: ${BUILD_SHA:-0123456789abcdef0123456789abcdef01234567}
    environment:
      DATABASE_URL: postgresql://findur:synthetic-local-only@postgres:5432/findur?sslmode=disable
      FIXTURE_BASE_URL: http://wiremock:8080
      FIXTURE_PROVIDER_BEARER_TOKEN: synthetic-access-token
    depends_on:
      postgres:
        condition: service_healthy
      wiremock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/findur", "healthcheck"]
      interval: 3s
      timeout: 3s
      retries: 20
    develop:
      watch:
        - action: rebuild
          path: ./backend
        - action: rebuild
          path: ./Dockerfile

  frontend:
    image: findur-frontend:${BUILD_SHA:-0123456789abcdef0123456789abcdef01234567}
    build:
      context: .
      target: frontend
      args:
        BUILD_SHA: ${BUILD_SHA:-0123456789abcdef0123456789abcdef01234567}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/__status"]
      interval: 3s
      timeout: 3s
      retries: 20
    develop:
      watch:
        - action: rebuild
          path: ./frontend
        - action: rebuild
          path: ./deploy/nginx.conf

  frontend-dev:
    image: findur-frontend-dev:${BUILD_SHA:-0123456789abcdef0123456789abcdef01234567}
    profiles: ["dev"]
    build:
      context: .
      target: frontend-build
      args:
        BUILD_SHA: ${BUILD_SHA:-0123456789abcdef0123456789abcdef01234567}
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    environment:
      VITE_API_PROXY: http://backend:10000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /src/frontend/src
        - action: rebuild
          path: ./frontend/package-lock.json
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/index.html
        - action: rebuild
          path: ./frontend/vite.config.ts
        - action: rebuild
          path: ./frontend/tsconfig.json
        - action: rebuild
          path: ./frontend/tsconfig.app.json
        - action: rebuild
          path: ./frontend/tsconfig.node.json

  integration:
    image: node:26.9.0-alpine3.23
    profiles: ["test"]
    working_dir: /work
    command: ["node", "integration.mjs"]
    environment:
      BASE_URL: http://frontend:8080
      BROWSER_URL: http://browser:4444
      EXPECTED_SHA: ${BUILD_SHA:-0123456789abcdef0123456789abcdef01234567}
    volumes:
      - ./test/integration:/work:ro
    depends_on:
      frontend:
        condition: service_healthy
      browser:
        condition: service_healthy

  browser:
    image: selenium/standalone-chromium:4.29.0-20250222
    profiles: ["test"]
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:4444/wd/hub/status | grep -q '\"ready\": true'"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
