name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: GolangCI-Lint
        uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          version: v2.13.0
          working-directory: backend
      - name: Verify generated API is current
        run: go generate ./... && git diff --exit-code -- api internal/generated
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: |
          mkdir -p bin
          go build -o bin/findur ./cmd/findur
          go build -o bin/migrate ./cmd/migrate

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Verify generated browser API is current
        run: npm run generate:api && git diff --exit-code -- src/generated/api.ts
      - name: Test
        run: npm test -- --run
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  integration:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose topology
        run: docker compose config --quiet
      - name: Build and start deploy-shaped services
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          docker compose build
          docker compose up --no-build --wait
      - name: Verify migration-first readiness and container lifecycle
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -eu
          wait_for_ready() {
            for attempt in $(seq 1 30); do
              if response=$(curl --fail --silent --show-error http://127.0.0.1:8080/api/readyz 2>/dev/null) \
                && test "$response" = "{\"status\":\"ready\",\"buildSha\":\"$BUILD_SHA\"}"; then
                return 0
              fi
              test "$attempt" -lt 30
              sleep 1
            done
          }
          assert_schema() {
            latest_migration=$(find backend/db/migrations -type f -name '*.up.sql' -printf '%f\n' | sort -V | tail -n 1)
            latest_version=${latest_migration%%_*}
            latest_version=$((10#$latest_version))
            schema_state=$(docker compose exec -T postgres \
              psql -U findur -d findur -Atc \
              "SELECT version::text || ':' || dirty::text FROM schema_migrations")
            test "$schema_state" = "$latest_version:false"
          }

          assert_schema
          docker compose restart backend
          wait_for_ready
          assert_schema
          backend_container=$(docker compose ps -q backend)
          docker compose stop backend
          test "$(docker inspect "$backend_container" --format '{{.State.ExitCode}}')" = '0'
          test "$(docker inspect "$backend_container" --format '{{.State.OOMKilled}}')" = 'false'
          if curl --fail --silent http://127.0.0.1:8080/api/readyz >/dev/null 2>&1; then
            echo "readiness unexpectedly succeeded while backend was stopped" >&2
            exit 1
          fi
          docker compose start backend
          wait_for_ready
      - name: Verify proxy, fixtures, browser execution, and exact identity
        env:
          BUILD_SHA: ${{ github.sha }}
        run: docker compose --profile test run --rm integration
      - name: Verify curated fixtures did not drift
        run: git diff --exit-code -- test/fixtures
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the exact tested backend image
        id: publish
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$DOCKERHUB_USERNAME"
          local_image="findur-backend:$BUILD_SHA"
          remote_image="docker.io/kdbuck/findur:$BUILD_SHA"
          test "$(docker image inspect "$local_image" --format '{{.Architecture}}')" = 'amd64'
          docker tag "$local_image" "$remote_image"
          push_log="$RUNNER_TEMP/findur-docker-push.log"
          docker push "$remote_image" | tee "$push_log"
          digest=$(sed -n 's/^.*digest: \(sha256:[0-9a-f]\{64\}\).*$/\1/p' "$push_log" | tail -n 1)
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Stop services
        if: always()
        run: docker compose --profile test down --volumes

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: true
    env:
      RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
      RENDER_BACKEND_SERVICE_ID: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
      RENDER_FRONTEND_DEPLOY_HOOK_URL: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}
      PUBLIC_ORIGIN: ${{ secrets.PUBLIC_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - name: Request immutable backend and exact-commit frontend deploys
        env:
          IMAGE_DIGEST: ${{ needs.integration.outputs.digest }}
        run: |
          test -n "$RENDER_API_TOKEN"
          test -n "$RENDER_BACKEND_SERVICE_ID"
          test -n "$RENDER_FRONTEND_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $RENDER_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "{\"imageUrl\":\"docker.io/kdbuck/findur@$IMAGE_DIGEST\"}" \
            "https://api.render.com/v1/services/$RENDER_BACKEND_SERVICE_ID/deploys" >/dev/null
          case "$RENDER_FRONTEND_DEPLOY_HOOK_URL" in
            *\?*) ref_separator='&' ;;
            *) ref_separator='?' ;;
          esac
          curl --fail --silent --show-error --max-time 20 \
            -X POST "$RENDER_FRONTEND_DEPLOY_HOOK_URL${ref_separator}ref=${{ github.sha }}" >/dev/null
      - name: Bounded public deployment-health smoke
        run: ./scripts/smoke-deployment.sh "$PUBLIC_ORIGIN"
      - name: Bounded browser deployment-health smoke
        env:
          BROWSER_URL: http://127.0.0.1:4444
        run: |
          docker run --detach --rm --name findur-deploy-browser \
            --publish 127.0.0.1:4444:4444 --shm-size=1g \
            selenium/standalone-chromium:4.29.0-20250222 >/dev/null
          cleanup() { docker stop findur-deploy-browser >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4444/wd/hub/status | grep -q '"ready": true'; then
              break
            fi
            test "$attempt" -lt 40
            sleep 1
          done
          for attempt in $(seq 1 30); do
            if PUBLIC_ORIGIN="$PUBLIC_ORIGIN" node test/integration/browser-status.mjs; then
              exit 0
            fi
            test "$attempt" -lt 30
            sleep 10
          done
